# iop-toolkit - single-command deployment.
#
#   cd deploy && cp .env.example .env && docker compose up -d --build
#
# All services (except the host-networked collector) share the `iop-net`
# bridge so they resolve each other by service name (mysql, kafka, minio).
# The collector uses host networking (real OLT connectivity + dynamic log
# ports 10000-20000) and reaches infra through published host ports.

name: iop-toolkit

services:
  mysql:
    image: mysql:8.0
    container_name: iop-mysql
    restart: always
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      # Generous retries: first boot restores a large IOP_Library dump before
      # the server accepts external connections.
      retries: 90
      start_period: 60s
    networks:
      - iop-net

  minio:
    image: quay.io/minio/minio
    container_name: iop-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - iop-net

  minio-init:
    image: quay.io/minio/mc
    container_name: iop-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} &&
      mc mb --ignore-existing local/${MINIO_BUCKET} &&
      echo 'minio bucket ${MINIO_BUCKET} ready';
      "
    networks:
      - iop-net

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: iop-kafka
    restart: always
    ports:
      - "${KAFKA_INTERNAL_PORT}:9092"
      - "${KAFKA_EXTERNAL_PORT}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094"
      # INTERNAL: reachable by other containers via the service name `kafka`.
      # EXTERNAL: reachable by host-networked clients (collector) via localhost.
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_ADVERTISED_HOST}:${KAFKA_EXTERNAL_PORT}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_CLUSTER_ID: "kraft-cluster-1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - iop-net

  kafka-init:
    image: confluentinc/cp-kafka:latest
    container_name: iop-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ${KAFKA_TOPIC_REQUEST} --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ${KAFKA_TOPIC_RESPONSE} --partitions 1 --replication-factor 1 &&
      echo 'kafka topics ready' &&
      kafka-topics --bootstrap-server kafka:9092 --list;
      "
    networks:
      - iop-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: iop-kafka-ui
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT}:9090"
    environment:
      SERVER_PORT: 9090
      SERVER_ADDRESS: 0.0.0.0
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - iop-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
        GOPROXY: ${GOPROXY}
        APT_MIRROR: ${APT_MIRROR}
    image: iop-toolkit/backend:latest
    container_name: iop-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      SERVER_RUN_MODE: release
      SERVER_HTTP_PORT: "8080"
      SERVER_ADDR: "0.0.0.0:8080"
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ADDR: "mysql:3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      KAFKA_ADDR: "kafka:9092"
      KAFKA_TOPIC_REQUEST: ${KAFKA_TOPIC_REQUEST}
      KAFKA_TOPIC_RESPONSE: ${KAFKA_TOPIC_RESPONSE}
      KAFKA_GROUP_REQUEST: ${KAFKA_GROUP_REQUEST}
      KAFKA_GROUP_RESPONSE: ${KAFKA_GROUP_RESPONSE}
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "false"
      MINIO_BUCKET: ${MINIO_BUCKET}
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - backend-uploads:/omcianalyzer/static/uploads
    networks:
      - iop-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
        VITE_API_BASE: ${VITE_API_BASE}
    image: iop-toolkit/frontend:latest
    container_name: iop-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"
      # The backend used to answer on 8080 with its own copy of the SPA, so
      # bookmarks and scripts point there. nginx now takes that port and
      # serves the same site, reverse-proxying /api and /uploads as always,
      # which keeps those URLs working instead of stranding them.
      - "${FRONTEND_COMPAT_PORT}:80"
    networks:
      - iop-net

  collector:
    build:
      context: ../collector
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
        PIP_INDEX_URL: ${PIP_INDEX_URL}
    image: iop-toolkit/collector:latest
    container_name: iop-collector
    restart: always
    privileged: true
    # Host networking: the collector must be reachable by OLTs on dynamic log
    # ports (10000-20000) and talks to infra through published host ports.
    network_mode: host
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: "localhost:${KAFKA_EXTERNAL_PORT}"
      KAFKA_TOPIC_REQUEST: ${KAFKA_TOPIC_REQUEST}
      KAFKA_TOPIC_RESPONSE: ${KAFKA_TOPIC_RESPONSE}
      KAFKA_GROUP_REQUEST: ${KAFKA_GROUP_REQUEST}
      MINIO_ENDPOINT: "localhost:${MINIO_PORT}"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "false"
      COLLECTOR_HOST_IP: ${COLLECTOR_HOST_IP}
    volumes:
      - collector-logs:/app/logs

volumes:
  mysql-data:
  minio-data:
  kafka-data:
  backend-uploads:
  collector-logs:

networks:
  iop-net:
    driver: bridge
