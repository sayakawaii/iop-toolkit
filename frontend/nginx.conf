map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Allow large OMCI log uploads.
    client_max_body_size 512m;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API (same-origin reverse proxy). Supports WebSocket upgrade
    # for /api/collector/ws.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Uploaded artifacts (diagrams .svg, plantuml .wsd, raw logs) are served by
    # the backend via r.Static("/uploads", ...). Diagram/plantuml API returns
    # root-relative paths like /uploads/<...>, resolved here same-origin.
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Asset filenames carry a content hash, so a changed file is a different
    # name and these can be cached indefinitely.
    location /assets/ {
        # A missing asset is a 404. Letting it reach the SPA fallback below
        # answers a .js request with index.html under a 200, and the browser
        # reports that as a syntax error instead of the missing file it is --
        # which is what a stale cached index.html looks like after a deploy.
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The document naming those assets must never be cached, or a returning
    # browser keeps asking for the bundle of a previous deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback, for navigation routes only.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
